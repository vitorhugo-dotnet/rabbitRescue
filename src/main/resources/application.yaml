rabbit-rescue:
  messaging:
    # Tempo que a mensagem permanece na fila de retry.
    retry-delay: 5s

    # Total de processamentos, incluindo a primeira tentativa.
    max-attempts: 3

    # Máximo de mensagens retornadas ao consultar a DLQ.
    dead-letter-browse-limit: 100

spring:
  docker:
    compose:
      file: docker-compose.yml
      lifecycle-management: start-and-stop

      readiness:
        timeout: 30s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:rabbitrescue}
    password: ${RABBITMQ_PASSWORD:rabbitrescue}
    virtual-host: ${RABBITMQ_VHOST:/}

    publisher-confirm-type: correlated
    publisher-returns: true

    template:
      mandatory: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always